name: docker container workflow
on: push
env:
                CONTAINER_REGISTRY: docker.io
                DOCKER_USERNAME: ajwa123
                DOCKER_IMAGENAME: github-action-nginx
jobs:
    build:
        runs-on: ubuntu-latest
        steps:
             - name: checkout repo
               uses: actions/checkout@v4
             - name: docker build
               run:  docker build -t $CONTAINER_REGISTRY/$DOCKER_USERNAME/$DOCKER_IMAGENAME:latest .
             - name: docker login
               env:
                  DOCKER_PASSWORD :  34rtymi67m
               run:  docker login --username $DOCKER_USERNAME  --password  $DOCKER_PASSWORD
             - name: docker publish
               run:  docker push  $CONTAINER_REGISTRY/$DOCKER_USERNAME/$DOCKER_IMAGENAME:latest
               
    deploy:
        needs: build
        runs-on: ubuntu-latest
        steps: 
             - name: checkout repo
               uses: actions/checkout@v4
             - name: docker run
               run :  docker run -d -p 8000:80 $CONTAINER_REGISTRY/$DOCKER_USERNAME/$DOCKER_IMAGENAME:latest